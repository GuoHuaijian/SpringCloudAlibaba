# Sloth Boot 可观测性演示 - Docker Compose
# 一键启动: docker-compose up -d --build

services:
  # ==================== 可观测性基础设施 ====================

  tempo:
    image: grafana/tempo:2.6.1
    container_name: sloth-tempo
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./config/tempo/tempo-config.yml:/etc/tempo/config.yml
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: sloth-otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./config/otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: sloth-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"

  loki:
    image: grafana/loki:3.2.0
    container_name: sloth-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.0.0
    container_name: sloth-grafana
    environment:
      # 安全提示: 共享/生产环境请通过 .env 覆盖管理员密码
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-sloth-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

  # ==================== Demo 应用 ====================

  sloth-observability:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sloth-observability
    ports:
      - "${OBSERVABILITY_HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
      # ===== OpenTelemetry Java Agent 生产级配置 =====
      OTEL_SERVICE_NAME: sloth-observability-demo
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=demo,service.namespace=sloth-boot,service.version=1.0.0"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRICS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      # 演示全采样，生产可降到 parentbased_traceidratio + 0.1~
      OTEL_TRACES_SAMPLER: parentbased_always_on
      # metric 关联 exemplar，配合 Prometheus OpenMetrics 在 Grafana 实现 trace↔metric 跳转
      OTEL_METRICS_EXEMPLAR_FILTER: always_on
      # 有限捕获请求/响应头（规避敏感信息泄漏）
      OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_REQUEST_HEADERS: "x-request-id,content-type"
      OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_RESPONSE_HEADERS: "x-request-id,content-type"
    restart: unless-stopped

volumes:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:
