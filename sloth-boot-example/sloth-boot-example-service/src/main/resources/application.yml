# ===== 服务基础配置 =====
server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: sloth-example
  profiles:
    active: dev
  autoconfigure:
    exclude:
      - com.sloth.boot.starter.ai.config.AiEmbeddingAutoConfiguration
      - com.sloth.boot.starter.ai.config.AiImageAutoConfiguration
      - com.sloth.boot.starter.ai.config.AiObservabilityAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  main:
    allow-bean-definition-overriding: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    model:
      chat: openai
    openai:
      base-url: https://api.openai.com
      api-key: ${OPENAI_API_KEY:sk-placeholder}
  # 数据源配置
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:sloth_boot;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  # Redis 连接配置（默认使用内嵌 Redis 端口 16379，可通过环境变量切换为外部 Redis）
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

# ===== MyBatis-Plus 配置 =====
mybatis-plus:
  mapper-locations: classpath*:com/sloth/boot/example/infrastructure/repository/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ===== Actuator 配置 =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,threadPools,appInfo,jvmInfo,metricsSummary,systemResources
      cors:
        allowed-origins:
          - "http://localhost:8080"
          - "http://127.0.0.1:8080"
        allowed-methods: GET,POST
  endpoint:
    health:
      show-details: always

# ===== Sloth Boot 自定义配置 =====
sloth:
  # Web 组件配置
  web:
    response-wrapper: true
    cors:
      allowed-origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
      max-age: 3600

  # XSS 防护配置
  xss:
    enabled: true
    exclude-urls:
      - /actuator/**
      - /api/security/**
      - /api/system/login

  # AI 能力配置
  ai:
    enabled: false
    model: gpt-4o-mini
    temperature: 0.7
    top-p: 1.0
    max-tokens: 2048
    default-system-prompt: "你是 Sloth Boot 示例服务内置的 AI 助手，请使用简洁、准确、工程化的中文回答问题。"

  # Redis 能力配置
  redis:
    key-prefix: "example:"
    bloom-filter:
      expected-insertions: 10000
    pub-sub:
      enabled: true

  # MyBatis 能力配置
  mybatis:
    tenant-enabled: false
    tenant-column: tenant_id
    tenant-ignore-tables:
      - sys_dict
    slow-sql-threshold: 1000
    encrypt-key: ${SLOTH_ENCRYPT_KEY:}  # 字段加密密钥，通过环境变量配置

  # 定时任务配置（XXL-Job）
  job:
    enabled: false  # 示例模块默认禁用，需要时改为 true 并配置 XXL-Job 地址
    admin-addresses: http://localhost:8080/xxl-job-admin
    access-token: ${XXL_JOB_ACCESS_TOKEN:}
    appname: sloth-example
    port: 9999
    log-path: ./logs/xxl-job
    log-retention-days: 30

  # 线程池配置
  thread-pool:
    pools:
      default:
        core-size: 8
        max-size: 32
        queue-capacity: 1024
        keep-alive-time: 60
        thread-name-prefix: sloth-async-
        rejected-policy: CALLER_RUNS
      scheduled:
        core-size: 4
        max-size: 8
        queue-capacity: 256
        keep-alive-time: 60
        thread-name-prefix: sloth-scheduled-
        rejected-policy: CALLER_RUNS

  # 监控配置
  monitor:
    slow-api-enabled: true
    slow-api-threshold: 1000
    alarm:
      enabled: false
      type: dingtalk
      webhook: ""

  # 文档配置
  doc:
    title: "示例服务 API"
    description: "Sloth Boot 示例服务接口文档"
    version: "1.0.0"
    contact-name: "sloth-boot"
    contact-email: "564559079@qq.com"
    base-packages:
      - com.sloth.boot.example.adapter.controller

  # 日志配置
  log:
    print-access-log: true
    print-response-log: false
    max-body-length: 2048
    exclude-urls:
      - /actuator/**

  # 可选能力示例
  sentinel:
    enabled: false
  seata:
    enabled: false
  sms:
    enabled: false
    type: aliyun
    access-key-id: ""
    access-key-secret: ""
    sign-name: ""
    region-id: cn-hangzhou

  # 认证授权配置
  auth:
    token-name: Authorization
    token-timeout: 7200
    white-list:
      - /api/auth/login
      - /api/auth/logout
      - /api/auth/current-user
      - /api/monitor/**
      - /doc.html
      - /webjars/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /actuator/**
