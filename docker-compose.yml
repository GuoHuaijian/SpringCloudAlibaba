# Sloth Boot 示例服务 Docker Compose
# 一键启动: docker-compose up -d
# 启动后访问:
#   - 健康检查: http://localhost:8080/actuator/health
#   - API 文档: http://localhost:8080/doc.html
#
# 数据说明: 示例服务默认使用内存 H2 数据库；MySQL 容器加载 docs/sql 供本地数据实验
# 安全提示: 生产环境请通过 .env 文件覆盖 MYSQL_ROOT_PASSWORD

version: '3.8'

services:
  # ==================== 基础设施 ====================

  mysql:
    image: mysql:8.0
    container_name: sloth-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sloth}
      MYSQL_DATABASE: sloth_boot
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sloth-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 应用服务 ====================

  sloth-example:
    build:
      context: .
      dockerfile: sloth-boot-example/sloth-boot-example-service/Dockerfile
    container_name: sloth-example
    ports:
      - "${SLOTH_EXAMPLE_HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
